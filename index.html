<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="AI Academic Resume - 可视化编辑、Section 管理、智能 A4 分页" />
  <title>AI Academic Resume</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <aside class="control-panel">
    <div class="control-inner">
      <p class="eyebrow">HTML Resume</p>
      <h1>可视化编辑 · Section 管理 · 自动分页</h1>
      <p class="control-desc">
        无需修改代码。可以直接编辑内容、新增/删除 Section、新增实习/项目/论文条目，
        页面会自动重新分页。
      </p>

      <button class="action-button primary" data-action="edit">✏️ 可视化编辑简历</button>
      <label class="action-button secondary" for="avatar-upload">上传头像</label>
      <input id="avatar-upload" type="file" accept="image/*" hidden />
      <button class="action-button secondary" data-action="clear-avatar">恢复头像占位</button>
      <button class="action-button secondary" data-action="print">打印 / 导出 PDF</button>
      <button class="action-button secondary" data-action="download-json">下载 JSON 数据</button>
      <button class="action-button secondary" data-action="download-js">下载 resume-data.js</button>
      <label class="action-button secondary" for="data-import">导入 JSON 数据</label>
      <input id="data-import" type="file" accept="application/json,.json" hidden />
      <button class="action-button ghost" data-action="reset-data">恢复示例数据</button>

      <div class="control-note">
        <strong>自动分页</strong>
        <span>当前共 <b id="page-count">1</b> 页。完整条目放不下时自动移动到下一页。</span>
      </div>

      <div class="control-note">
        <strong>网页编辑</strong>
        <span>支持 Section 新增 / 删除 / 改名，以及教育、论文、实习、项目和技能条目无限新增。</span>
      </div>
    </div>
  </aside>

  <main class="workspace">
    <div id="resume-pages" class="resume-pages" aria-live="polite"></div>
  </main>

  <div class="editor-backdrop" id="editor-backdrop" hidden></div>

  <aside class="editor-drawer" id="editor-drawer" aria-hidden="true">
    <header class="editor-header">
      <div>
        <p class="editor-eyebrow">VISUAL EDITOR</p>
        <h2>编辑简历</h2>
        <p>修改会实时预览、自动保存，并立即重新计算分页。</p>
      </div>
      <button type="button" class="icon-button" data-action="close-editor" aria-label="关闭">×</button>
    </header>

    <nav class="editor-tabs" id="editor-tabs">
      <button type="button" class="editor-tab active" data-editor-tab="basics">基本信息</button>
      <button type="button" class="editor-tab" data-editor-tab="sections">模块管理</button>
    </nav>

    <div class="editor-body">
      <section class="editor-pane active" data-editor-pane="basics"></section>
      <section class="editor-pane" data-editor-pane="sections"></section>
      <div id="dynamic-editor-panes"></div>
    </div>

    <footer class="editor-footer">
      <span class="save-status" id="save-status">已自动保存</span>
      <button type="button" class="editor-footer-button" data-action="download-json">下载 JSON</button>
      <button type="button" class="editor-footer-button primary" data-action="download-js">下载 resume-data.js</button>
    </footer>
  </aside>

  <script src="resume-data.js"></script>
  <script src="script.js"></script>
</body>
</html>
